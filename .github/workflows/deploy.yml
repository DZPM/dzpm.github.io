name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:          # a Dependabot bump is built and checked before it reaches main; a pull request never deploys
    branches: [main]
  workflow_dispatch:

permissions: {}   # each job asks for what it needs: the build runs third-party packages and must not hold the deploy rights

env:
  TZ: Europe/Madrid   # the timestamp each page carries is the author's clock, not the runner's UTC

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      posts_changed: ${{ steps.posts.outputs.changed }}
    concurrency:          # one group per branch or pull request: a newer push replaces an older build of the same ref only
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false   # no token in .git/config for the steps that follow
          fetch-depth: 0               # the full history: a page's sitemap lastmod is the date of its last commit
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true           # keyed by uv.lock
          activate-environment: true   # .venv/bin on PATH for the steps that follow
      - run: uv sync --locked   # every package, direct or not, as uv.lock pins it, with the hash of its files; fails if the lock is stale
      - run: pelican content -o output -s publishconf.py --fatal warnings
      - run: python -m pagefind --site output --quiet
      - id: posts   # did this push add, change, or rename a post (a new date renames its file)? Then the deploy tells IndexNow that the home page changed
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          changed=false
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null && [ -n "$(git diff --name-only --diff-filter=AMR "$BEFORE" "$AFTER" -- content/posts/)" ]; then
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - run: python tools/pii_gate.py --tree
      - run: python tools/pii_gate.py --output output
      - run: python tools/check_stubs.py output
      - run: python tools/check_links.py output
      - run: python tools/check_csp.py output
      - run: python tools/check_meta.py output
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: output
          # v5 excludes every dot path from the artifact unless you ask for them, and /.well-known/
          # holds security.txt and keybase.txt. v3 had no such exclusion.
          include-hidden-files: true

  workflows:   # the workflow files themselves: expressions, job outputs, and the shell in each run step (ShellCheck ships with the runner image)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - env:   # a pinned release, checked against its published checksum; Dependabot does not update these two lines
          VERSION: "1.7.12"
          SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" "https://github.com/rhysd/actionlint/releases/download/v$VERSION/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "$SHA256  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:          # only deploys share this group, so a pull request cannot cancel or hold one; a started deploy runs to the end
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read      # the sparse checkout of the purge and IndexNow tools, and the IndexNow key
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
      # Cloudflare keeps the HTML for a week (docs/adr/0010): purge it now, after GitHub serves the new build, and
      # fail the deploy if the edge does not serve it. The token and the zone id live in the github-pages environment,
      # which only takes deploys from main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          sparse-checkout: |
            tools/purge_edge.py
            tools/indexnow.py
            content/extra/*.txt
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - run: python3 tools/purge_edge.py --commit "$COMMIT"
        env:
          COMMIT: ${{ github.sha }}
          CLOUDFLARE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_PURGE_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
      # A push that adds or changes a post tells IndexNow (Bing and others; not Google) that the home page changed:
      # the home lists every post. A failure here does not fail the deploy, which is already live and verified.
      - if: needs.build.outputs.posts_changed == 'true'
        continue-on-error: true
        run: python3 tools/indexnow.py --home
