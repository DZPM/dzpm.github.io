name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  TZ: Europe/Madrid   # the timestamp each page carries is the author's clock, not the runner's UTC

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pelican content -o output -s publishconf.py --fatal warnings
      - run: python -m pagefind --site output --quiet
      - run: python tools/pii_gate.py --tree
      - run: python tools/pii_gate.py --output output
      - run: python tools/check_stubs.py output
      - run: python tools/check_links.py output
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: output
          # v5 excludes every dot path from the artifact unless you ask for them, and /.well-known/
          # holds security.txt and keybase.txt. v3 had no such exclusion.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
